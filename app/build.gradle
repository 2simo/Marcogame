plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marcogame'
    compileSdk 35

    defaultConfig {
        applicationId 'com.marcogame'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}
